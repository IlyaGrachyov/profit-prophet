<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Per-page SEO tags (title, description, OG, canonical) are injected here:
         by react-helmet-async at runtime, and baked in at build time by the
         prerenderer (prerender.mjs), so crawlers without JS still see them. -->
    <!--app-head-->
  </head>

  <body>
    <div id="root"></div>
    <noscript>Для работы сайта включите JavaScript.</noscript>
    <script>
      if (window.location.protocol === "file:") {
        document.documentElement.style.height = "100%";
        document.body.style.height = "100%";
        document.body.style.margin = "0";
        document.body.innerHTML = `
          <iframe
            src="./site/index.html"
            title="Marketing Gid"
            style="display:block;width:100vw;height:100vh;border:0;"
          ></iframe>
        `;
      }
    </script>
    <script type="module">
      if (window.location.protocol !== "file:") {
        import("/src/main.tsx");
      }
    </script>
  </body>
</html>
